# Publish to PyPI and deploy docs when a GitHub Release is published, or manually
# (workflow_dispatch).
#
# Do not push version tags directly: `gh release create` publishes the release
# (and the tag) and triggers this workflow once, after CI checks pass here.
name: release-main

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  quality-check:
    if: github.repository == 'yoch/modpoll2mqtt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Run checks
        run: make check

  test:
    if: github.repository == 'yoch/modpoll2mqtt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test

  build-and-publish-pypi:
    if: github.repository == 'yoch/modpoll2mqtt'
    needs: [quality-check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Export version
        id: vars
        run: |
          source .venv/bin/activate
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="v$(poetry version -s)"
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set package version
        run: |
          source .venv/bin/activate
          poetry version "${{ steps.vars.outputs.version }}"

      - name: Build package
        run: |
          source .venv/bin/activate
          poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  deploy-docs:
    if: github.repository == 'yoch/modpoll2mqtt'
    needs: build-and-publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Set up pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Install package for doc build
        run: |
          source .venv/bin/activate
          poetry install --only-root --no-interaction

      - name: Build documentation
        run: make docs

      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
