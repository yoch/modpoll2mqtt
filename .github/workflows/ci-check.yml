# Lint, lock file, dependency checks (make check), and docs build (make docs).
name: ci-check

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Run checks
        run: make check

  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Set up pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Install package for doc build
        run: |
          source .venv/bin/activate
          poetry install --only-root --no-interaction

      - name: Build documentation
        run: make docs
