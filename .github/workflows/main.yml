# CI on push/PR to main. On a fork, enable Actions once under
# Settings → Actions → General if workflows never start automatically.
name: main

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Run checks
        run: make check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: make test

  docs-build:
    name: docs (build only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up poetry
        uses: ./.github/actions/setup-poetry

      - name: Set up pandoc
        uses: ./.github/actions/setup-pandoc

      - name: Install package for doc build
        run: |
          source .venv/bin/activate
          poetry install --only-root --no-interaction

      - name: Build documentation
        run: make docs
