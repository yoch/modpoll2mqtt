[tool.poetry]
name = "modpoll2mqtt"
version = "2.2.0"
description = "Modbus to MQTT gateway — fork of modpoll"
authors = ["yoch <yoch.melka@gmail.com>"]
repository = "https://github.com/yoch/modpoll2mqtt"
documentation = "https://yoch.github.io/modpoll2mqtt"
homepage = "https://github.com/yoch/modpoll2mqtt"
readme = "README.md"
packages = [{ include = "modpoll" }]
license = "MIT"
requires-poetry = ">=2.0,<3.0"
keywords = [
    "modbus",
    "modpoll",
    "mqtt",
    "gateway",
    "bridge",
    "iot",
    "industrial-automation",
    "building-automation",
    "modbus-tcp",
    "modbus-rtu",
    "modbus-udp",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Monitoring",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pymodbus = ">=3.10,<4.0"
paho-mqtt = "^2.1.0"
prettytable = "^3.9.0"
requests = "^2.32.5"
pyserial = { version = "^3.5", optional = true }

[tool.poetry.extras]
serial = ["pyserial"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
pytest = "^8.2.2"
deptry = "^0.25"
ruff = "^0.11"

[tool.poetry.group.docs.dependencies]
sphinx = ">=7,<10"
sphinx-argparse = "^0.5.2"
sphinx-rtd-theme = "^3.1"
sphinx-autobuild = { version = "^2025.8", python = ">=3.11,<4.0" }
pandoc = "^2.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.deptry]
package_module_name_map = { pyserial = "serial" }

[tool.deptry.per_rule_ignores]
DEP002 = ["pyserial"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "modbus: Modbus TCP integration tests",
    "mqtt: MQTT broker integration tests",
]

[tool.poetry.scripts]
modpoll = "modpoll.main:app"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["modpoll", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["modpoll"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
